# Tubular TMux Configuration
# Define your colors and content - the plugin handles all styling

# absolute-centre keeps the window list dead-center regardless of the
# left/right section widths (this replaces the old shell-based centering)
set -g status-justify "absolute-centre"

# Window alerts: light up a backgrounded window's tab when it produces output
# (activity) or rings the bell (urgent). tubular styles them — activity gets a
# brighter foreground, a bell gets a red tab. See README "Window alerts".
setw -g monitor-activity on
setw -g monitor-bell on

# === Prefix Key (Required) ===
# Must match the `prefix` you set in tmux — the plugin takes this key over.
set -g @tubular_prefix_key "C-Space"

# === Color Configuration ===
# All colors (and the border character) inherit from the built-in "tubular"
# theme: kanagawa background, light-blue active border, pink/green/yellow mode
# highlights, heavy borders with extra-bold active/prefix. Any individual
# @tubular_* color set below would override the theme.
# Other built-ins: kanagawa, gruvbox, tokyonight, catppuccin, nord, one-dark.
set -g @tubular_theme "tubular"

# === Content Configuration ===
# This config is "bucket C" (my own text, tubular's colors): every slot whose
# @tubular_*_text is set is rendered by tubular; slots you don't set fall back
# to your native tmux value. No @tubular_manage_content switch is needed here
# because all three slots are set explicitly.
#
# Theme colors use {{token}} shortcuts (expanded once at load; see the README's
# Theme Color Reference). Dynamic ones like {{mode_fg}} inject the required
# #{E:...} for you, so you never manage the E: distinction by hand.
set -g @tubular_window_tab_text " #W "
set -g @tubular_status_left_text "#{?client_prefix,󰞦#[fg={{copy}}]󰞦#[fg={{mode_fg}}]󰞦, #{?window_zoomed_flag,{{zoom_indicator}},#[fg=#{?pane_in_mode,{{mode_fg}},{{copy}}}]󰞦 #[fg={{mode_fg}}]}} #S  "
# Voice-typing live partials: poll the daemon state once per second. (tmux-sensible
# sets this to 5; its "only-if-unchanged-from-default" guard leaves our 1 alone.)
# The partial itself is injected into @tubular_status_right_text via the wrapper
# at scripts/voice-partial.sh — empty when idle, so the right-side is unchanged.
set -g status-interval 1
set -g @tubular_status_right_text "#(/home/dustin/.config/tmux/scripts/voice-partial.sh)#{?window_zoomed_flag,{{zoom_indicator}}#{window_panes}  , }#{b:pane_current_path}  󰃰  %I:%M  "

set -g @tubular_tab_start ""
set -g @tubular_tab_end ""
set -g @tubular_separator "  "
set -g @tubular_zoom_indicator " "

# === Border Style Configuration ===
# Border character (heavy lines, extra-bold active/prefix, thin copy) now
# comes from the "tubular" theme. Uncomment to override per option:
# set -g @tubular_normal_border_lines "single"
# set -g @tubular_normal_extra_bold "0"
# set -g @tubular_active_extra_bold "1"
# set -g @tubular_prefix_extra_bold "1"
# set -g @tubular_copy_extra_bold "0"

# === Pane Background ===
# Paint ONLY the focused pane solid (@tubular_bg); inactive panes stay
# transparent so the terminal background shows through. The focused pane
# dims to @tubular_neutral_hidden while the prefix is held.
set -g @tubular_pane_bg "active"

# === Per-mode Pane Surface ===
# The focused pane's interior recolors per mode. tubular re-applies the right
# style on each mode change (copy via the pane-mode-changed hook, zoom via
# window-layout-changed, prefix via the key binding — prefix can't live in the
# format itself, see the plugin README). Only copy is customized below (a touch
# darker/brighter than the default bg_max/fg_focus); the others use defaults
# (normal/zoom = @tubular_bg, prefix = @tubular_neutral_hidden).
set -g @tubular_copy_pane_bg "#171720"
set -g @tubular_copy_pane_fg "#e8e8e8"
# set -g @tubular_normal_pane_bg "#1f1f28"  # default @tubular_bg
# set -g @tubular_prefix_pane_bg "#54546d"  # default @tubular_neutral_hidden
# set -g @tubular_zoom_pane_bg   "#1f1f28"  # default @tubular_bg


