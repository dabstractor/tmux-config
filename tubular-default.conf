# Tubular TMux — DEFAULT palette
# This file mirrors the plugin's built-in defaults as explicit variables so you
# can adjust them freely. Toggle between this and your custom tubular.conf with
# <prefix>+T (see scripts/tubular-palette-toggle.sh).

# Keep the layout identical to the custom config so only the palette differs
set -g status-justify "absolute-centre"

# === Prefix Key (Required) ===
# Must match the `prefix` you set in tmux — the plugin takes this key over.
set -g @tubular_prefix_key "C-Space"

# ============================================================================
# PALETTE — the part you'll be tweaking
# ============================================================================

# Background colors
set -g @tubular_bg "#1f1f28"              # Main background
set -g @tubular_bg_max "#181822"          # Darker background (the status bar) assuming dark theme
set -g @tubular_bg_min "#24242e"          # Lighter background assuming dark theme

# Foreground colors
set -g @tubular_fg "#dcd7ba"              # Main text
set -g @tubular_fg_active "#cccccc"       # Active text
set -g @tubular_fg_focus "#dddddd"        # Focused text
set -g @tubular_neutral_visible "#787878" # Subdued UI elements
set -g @tubular_neutral_hidden "#54546d"  # Faint indicators

# Mode-specific background colors (the ones that light up the whole bar)
set -g @tubular_zoom_color "#627d9a"      # Zoom mode
set -g @tubular_copy_color "#fffef7"      # Copy mode
# set -g @tubular_prefix_color "#dfc5a4"    # Prefix mode
set -g @tubular_prefix_color "#fffef7"    # Prefix mode
set -g @tubular_active_color "#dfc5a4"    # Active pane border / current-tab pill
# set -g @tubular_active_color "#babbbd"    # Active pane border / current-tab pill
# set -g @tubular_active_color "#2e3257"    # Active pane border / current-tab pill

# Mode-specific foreground colors (text on the lit-up bar; default = @tubular_bg)
set -g @tubular_prefix_fg "#1f1f28"
set -g @tubular_zoom_fg "#1f1f28"
set -g @tubular_copy_fg "#1f1f28"

# ============================================================================
# CONTENT
# ============================================================================
set -g @tubular_window_tab_text " #W "
set -g @tubular_status_left_text " #S  "
set -g @tubular_status_right_text "  󰃰  %I:%M  "
set -g @tubular_tab_start ""
set -g @tubular_tab_end ""
set -g @tubular_separator "   "
set -g @tubular_zoom_indicator "+"
set -g @tubular_pane_icons "󰼏󰼐󰼑󰼒󰼓󰼔󰼕󰼖󰼗󰼘"
set -g @tubular_window_icons "󰲠󰲢󰲤󰲦󰲨󰲪󰲬󰲮󰲰󰲞"

# ============================================================================
# BORDERS  (pane-border-lines is fixed; only colors/bold change per mode)
# ============================================================================
set -g @tubular_normal_border_lines "single"
set -g @tubular_normal_extra_bold "0"
set -g @tubular_active_extra_bold "1"
set -g @tubular_prefix_extra_bold "0"
set -g @tubular_copy_extra_bold "0"
