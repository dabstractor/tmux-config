source-file ~/.config/tmux/tmux.reset.conf

# Set the default terminal to a modern, compatible type for Alacritty.
# Using "xterm-kitty" here was incorrect and caused a lot of issues
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:RGB"
set-option -as terminal-features "alacritty*:extkeys"  # tell tmux Alacritty can send extended keys (>=0.13)
set-option -g default-shell /usr/bin/zsh
set-option -g extended-keys on
set-option -s extended-keys-format csi-u        # report modified keys as CSI u (matches Alacritty's kitty protocol)

set -g prefix C-Space

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g automatic-rename off      # window names are stable (named on creation, not per-command)
set -g set-clipboard on          # use system clipboard
set -g focus-events on           # turn on focus notifications
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
bind-key -T copy-mode-vi Escape send-keys -X cancel

# set -sg repeat-time 1000
# set -g mouse on                  # enable mouse support for wheel events (won't affect normal scrolling)

set -g @thumbs-key e
set -g @thumbs-unique enabled
set -g @thumbs-command 'echo -n {} | wl-copy'

# Pane navigation (Ctrl+Alt+h/j/k/l) is handled by the tmux-zoom-navigation
# plugin, loaded via run-shell below. It moves between panes while preserving
# the window's zoom (fullscreen) state. Keys are overridable via the
# @zoom-nav-{left,down,up,right}-key options; empty disables a direction.

# Window management
# New window (prefix t) opens in the current dir and is named after that dir.
# Overrides reset.conf's plain new-window; 'c' stays as kill-pane (also from reset.conf).
bind-key t new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"
# New window via zoxide jump (prefix g): provided by the tmux-zoxide-sessions
# plugin (loaded via TPM below). Prompts for a zoxide query, jumps to its best
# frecency match in the current session, and names the window after that dir.
# No/empty match falls back to the current pane's directory.
# Move current window forward/backward in the session (follows focus + wraps at ends)
# Alacritty sends CSI-u for these chords (see alacritty.toml); shift+Tab arrives as BTab
bind-key -n C-M-Tab  swap-window -t +1 \; select-window -t +1   # Ctrl+Alt+Tab       -> move window forward
bind-key -n C-M-BTab swap-window -t -1 \; select-window -t -1   # Ctrl+Alt+Shift+Tab -> move window backward
bind-key C-w kill-window                                                    # <prefix>+Shift+W -> kill window
bind-key X kill-window                                                    # Alternative: <prefix>+Shift+X -> kill window (for testing)
bind-key C-q kill-server
bind-key N break-pane \; command-prompt -l -I "#{?#{@user_named},#W,}" "rename-window '%%'; setw @user_named 1"   # <prefix>+Shift+N -> break pane + rename (pre-fills only if user-named)
# Pane layout: prefix+Shift+Backspace -> previous-layout. Declared here in the
# live config (reset.conf only unbinds S-BSpace) so nothing sourced/bound
# after the reset file can silently shadow it.
bind-key -r S-BSpace previous-layout

# Keep focus-aware apps (lazygit) in sync with window switches.
# tmux's focus-events only synthesizes focus-out/in on pane switches, not
# window switches; this re-derives it for the whole session so hidden windows
# pause and the visible window resumes. Requires `set -g focus-events on`.
# Disabled: this hook injected ESC[I / ESC[O into every non-shell pane on each
# window switch — that's the ^[[I / ^[[O garbage dumped into running scripts.
# Its only purpose was to suppress focus-aware-app alerts (e.g. lazygit's
# background fetch) on hidden windows. sync-window-focus.sh is left on disk;
# uncomment the line below to re-enable.
# set-hook -g session-window-changed "run-shell -b ~/.config/tmux/scripts/sync-window-focus.sh"

# Session history (tmux-session-history plugin): browser-style back/forward,
# an Alt-Tab toggle, and an fzf picker over a single session timeline.
# Toggle ships on prefix+L (hijacks tmux's stock switch-client -l, but self-
# heals when the target session is gone). Back/forward/pick are unbound by
# default — set them below. It wires client-session-changed / session-closed /
# session-created hooks and its own init.
set -g @session-history-toggle-key  'L'       # <prefix>+L        -> toggle to previous session
set -g @session-history-back-key    'C-F9'    # <prefix>+Ctrl+F9  -> back
set -g @session-history-forward-key 'C-F10'   # <prefix>+Ctrl+F10 -> forward
set -g @session-history-pick-key  'E'   # opt-in: fzf history picker (needs fzf)

# Reload and management keybinds
bind-key C-r source-file ~/.config/tmux/tmux.conf                         # <prefix>+Ctrl+r -> reload config
bind-key C-t run-shell "~/.config/tmux/scripts/tubular-palette-toggle.sh" # <prefix>+Ctrl+t -> toggle custom/default palette
bind-key  / run-shell "~/.config/tmux/scripts/tubular-theme-cycle.sh"        # <prefix>+slash -> cycle full terminal theme carousel (overrides tmux default 'list-keys -1' prompt)
bind-key M-/ run-shell "~/.config/tmux/scripts/tubular-theme-cycle.sh prev"  # <prefix>+Alt+slash -> theme carousel backwards
bind-key C-/ run-shell "~/.config/tmux/scripts/tubular-layout-cycle.sh"      # <prefix>+Ctrl+slash -> cycle statusline-layout gallery
bind-key C-_ run-shell "~/.config/tmux/scripts/tubular-layout-cycle.sh"      # same key: most terminals send Ctrl+/ as Ctrl+_ (0x1f)
# bind-key C-M-/ run-shell "~/.config/tmux/scripts/tubular-layout-cycle.sh prev"  # <prefix>+Ctrl+Alt+slash -> layout gallery backwards
# bind-key C-M-_ run-shell "~/.config/tmux/scripts/tubular-layout-cycle.sh prev"  # same key, Ctrl+_ encoding
bind-key r command-prompt -l -I "#{?#{@user_named},#W,}" "rename-window '%%'; setw @user_named 1"   # <prefix>+r -> rename window (pre-fills only if user-named)
bind-key R command-prompt -I "#S" "rename-session '%%'"                   # <prefix>+Shift+R -> rename session
# Pane -> HTML snapshot (tmux-2html). Installed via TPM below; the loader
# builds it from source on first load (zig must be on PATH). Output lands in
# ~/.local/share/tmux-2html/ and auto-opens (@tmux-2html-open=on default).
# Bind full-pane capture to <prefix>+Shift+H to match the old term2html key.
set -g @tmux-2html-full-key H
# Dev: use my local working-tree build (rebuilt by every `zig build`) instead of
# building/downloading from the TPM clone. Remove this line once the dep-URL fix
# is pushed + a release exists, to exercise the real install path.
set -g @tmux-2html-binary-dir /home/dustin/projects/tmux-2html/zig-out/bin

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# TPM Plugins - MUST be declared BEFORE running TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'dabstractor/tmux-sessionx'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'dabstractor/tmux-session-history'
set -g @plugin 'dabstractor/tmux-zoxide-sessions'
set -g @plugin 'dabstractor/tmux-2html'

# Plugin configuration
set -g @sessionx-bind 'C-Space'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-restore 'C-R'          # <prefix>+Ctrl+Shift+R -> resurrect restore

set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @livepicker-key 'C-e'
set -g @livepicker-fg '#ffffff'
set -g @livepicker-zoxide-mode 'on'

set -g @auto-pane-min-columns 120
set -g @auto-pane-min-rows 60
set -g @auto-pane-aspect-ratio 3.7
# On a side-by-side split (prefix+Enter, the reverse key, or prefix+v), widen
# the pane that ends up on the right to 220 — but ONLY when the pane being
# split is over 315 columns wide (not the whole window). Works for the normal
# split (new pane on the right) and the reverse split (original pane swapped
# onto the right) alike: swap-pane moves panes between cells without changing
# cell widths, so the right cell keeps 220.
set -g @auto-pane-right-width 220
set -g @auto-pane-right-threshold 315
# prefix+v is a forced side-by-side split (overrides the plain `bind v` in
# tmux.reset.conf). Routing it through the plugin's `--horizontal` mode reuses
# the same pane-width-gated widen above, so v behaves like the smart split keys.
bind v run-shell "~/.config/tmux/plugins/tmux-auto-pane/scripts/auto_pane.sh --horizontal"

# Load statusline configuration (sets @tubular_* options)
source-file ~/.config/tmux/tubular.conf

# Manual plugin loading (if needed for specific plugins)
run-shell '~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.tmux'
run-shell '~/.config/tmux/plugins/tmux-livepicker/plugin.tmux'
run-shell '~/.config/tmux/plugins/tmux-zoom-navigation/zoom_navigation.tmux'
run-shell '~/.config/tmux/plugins/tmux-auto-pane/auto_pane.tmux'
# Reverse-split key override (must stay AFTER the plugin load above, which is
# blocking): drop the plugin's default M-Enter reverse key and use prefix+Ctrl+Enter
# instead. Alacritty emits Ctrl+Enter as a CSI-u sequence (see alacritty.toml);
# plain Enter stays the smart split. Do NOT delete this block or M-Enter returns.
unbind-key -T prefix M-Enter
bind-key -T prefix C-Enter run-shell "'/home/dustin/.config/tmux/plugins/tmux-auto-pane/scripts/auto_pane.sh' && tmux swap-pane -U"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Name a new session's first window after the session. Must run AFTER TPM
# above: tmux-zoxide-sessions sets its own session-created hook (z-session.sh)
# at TPM init and would clobber this otherwise. (This also turns off
# z-session.sh's auto-relocate, which was misdirecting sessions to the wrong dir.)
set-hook -g session-created 'rename-window "#{session_name}"'

# Plain Space must stay unbound: tmux-sensible binds prefix-without-Ctrl
# (Space, since the prefix is C-Space) to last-window during TPM init above.
# Kill it here so prefix+Space is a no-op and ONLY prefix+S-Space (next-layout)
# / prefix+S-BSpace (previous-layout) touch the pane layout.
unbind-key Space
