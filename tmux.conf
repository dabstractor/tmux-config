source-file ~/.config/tmux/tmux.reset.conf

# Set the default terminal to a modern, compatible type for Alacritty.
# Using "xterm-kitty" here was incorrect and likely the root cause of the issue.
set-option -g default-terminal "tmux-256color"
# set-option -g default-terminal "${TERM}" # This is incorrect, do not use.
set-option -sa terminal-overrides ",*:RGB"
set-option -g default-shell /usr/bin/zsh
set-option -g extended-keys on
set-option -s extended-keys-format csi-u        # report modified keys as CSI u (matches Alacritty's kitty protocol)
set-option -as terminal-features "alacritty*:extkeys"  # tell tmux Alacritty can send extended keys (>=0.13)

# set -g prefix None
# set -g prefix C-b
set -g prefix C-Space

# unbind C-Space

# bind-key -n C-Space run-shell "~/.config/tmux/scripts/prefix-highlight.sh on" \; switch-client -T prefix
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g automatic-rename off      # window names are stable (named on creation, not per-command)
set -g set-clipboard on          # use system clipboard
set -g focus-events on           # turn on focus notifications
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
bind-key -T copy-mode-vi Escape send-keys -X cancel

# New session -> first window inherits the session's name
set-hook -g session-created 'rename-window "#{session_name}"'

# set -sg repeat-time 1000
# set -g mouse on                  # enable mouse support for wheel events (won't affect normal scrolling)

set -g @thumbs-key e
set -g @thumbs-unique enabled
set -g @thumbs-command 'echo -n {} | wl-copy'

# Keyboard bindings for pane navigation (preserves normal mouse scrolling)
bind-key -n C-M-h run-shell "~/.config/tmux/scripts/select-pane.sh -L"   # Ctrl+Alt+h -> pane left
bind-key -n C-M-l run-shell "~/.config/tmux/scripts/select-pane.sh -R"   # Ctrl+Alt+l -> pane right
bind-key -n C-M-k run-shell "~/.config/tmux/scripts/select-pane.sh -U"   # Ctrl+Alt+k -> pane up
bind-key -n C-M-j run-shell "~/.config/tmux/scripts/select-pane.sh -D"   # Ctrl+Alt+j -> pane down

# Window management
# New window (prefix t) opens in the current dir and is named after that dir.
# Overrides reset.conf's plain new-window; 'c' stays as kill-pane (also from reset.conf).
bind-key t new-window -c "#{pane_current_path}" -n "#{b:pane_current_path}"
# New window via zoxide jump (prefix g): provided by the tmux-zoxide-sessions
# plugin (loaded via TPM below). Prompts for a zoxide query, jumps to its best
# frecency match in the current session, and names the window after that dir.
# No/empty match falls back to the current pane's directory.
# Move current window forward/backward in the session (follows focus + wraps at ends)
# Alacritty sends CSI-u for these chords (see alacritty.toml); shift+Tab arrives as BTab
bind-key -n C-M-Tab  swap-window -t +1 \; select-window -t +1   # Ctrl+Alt+Tab       -> move window forward
bind-key -n C-M-BTab swap-window -t -1 \; select-window -t -1   # Ctrl+Alt+Shift+Tab -> move window backward
bind-key C-w kill-window                                                    # <prefix>+Shift+W -> kill window
bind-key X kill-window                                                    # Alternative: <prefix>+Shift+X -> kill window (for testing)
bind-key C-q kill-server
bind-key N break-pane \; command-prompt -l -I "#{?#{@user_named},#W,}" "rename-window '%%'; setw @user_named 1"   # <prefix>+Shift+N -> break pane + rename (pre-fills only if user-named)

# Keep focus-aware apps (lazygit) in sync with window switches.
# tmux's focus-events only synthesizes focus-out/in on pane switches, not
# window switches; this re-derives it for the whole session so hidden windows
# pause and the visible window resumes. Requires `set -g focus-events on`.
set-hook -g session-window-changed "run-shell -b ~/.config/tmux/scripts/sync-window-focus.sh"

# Session history (tmux-session-history plugin): browser-style back/forward,
# an Alt-Tab toggle, and an fzf picker over a single session timeline. The
# plugin registers its own client-session-changed / session-closed hooks and
# its own init, so only the key overrides live here. Defaults shown; change
# or empty out any key as needed.
set -g @session-history-toggle-key  'L'       # <prefix>+L        -> toggle to previous session
set -g @session-history-back-key    'C-F9'    # <prefix>+Ctrl+F9  -> back
set -g @session-history-forward-key 'C-F10'   # <prefix>+Ctrl+F10 -> forward
# set -g @session-history-pick-key  'C-S-l'   # opt-in: fzf history picker (needs fzf)

# Reload and management keybinds
bind-key C-r source-file ~/.config/tmux/tmux.conf                         # <prefix>+Ctrl+r -> reload config
bind-key C-t run-shell "~/.config/tmux/scripts/tubular-palette-toggle.sh" # <prefix>+Ctrl+t -> toggle custom/default palette
bind-key  / run-shell "~/.config/tmux/scripts/tubular-layout-cycle.sh"       # <prefix>+slash -> cycle statusline-layout gallery (overrides tmux default 'list-keys -1' prompt)
bind-key r command-prompt -l -I "#{?#{@user_named},#W,}" "rename-window '%%'; setw @user_named 1"   # <prefix>+r -> rename window (pre-fills only if user-named)
bind-key R command-prompt -I "#S" "rename-session '%%'"                   # <prefix>+Shift+R -> rename session

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# TPM Plugins - MUST be declared BEFORE running TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'dabstractor/tmux-session-history'
set -g @plugin 'dabstractor/tmux-zoxide-sessions'

# Plugin configuration
set -g @sessionx-bind 'C-Space'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-restore 'C-R'          # <prefix>+Ctrl+Shift+R -> resurrect restore

set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'


set -g @livepicker-key 'C-e'
set -g @livepicker-fg '#ffffff'
set -g @livepicker-zoxide-mode 'on'

# Load statusline configuration (sets @tubular_* options)
source-file ~/.config/tmux/tubular.conf

# Manual plugin loading (if needed for specific plugins)
run-shell '~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.tmux'
run-shell '~/.config/tmux/plugins/tmux-livepicker/plugin.tmux'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
